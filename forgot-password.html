<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Act for Change</title>
    <meta name="description" content="Reset your Act For Change account password securely with a one-time code." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="donate.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <nav class="nav" id="nav" role="navigation" aria-label="Main">
      <div class="nav-inner">
        <a href="home.html" class="nav-brand" aria-label="Act for Change home">
          <img src="logo.png" alt="Act for Change" class="nav-logo" />
          <span class="nav-brand-text">Act For Change</span>
        </a>
        <ul class="nav-list" id="navList" role="list">
          <li><a href="home.html" class="nav-a">Home</a></li>
          <li><a href="who-we-are.html" class="nav-a">Who We Are</a></li>
          <li><a href="get-involved.html" class="nav-a">Get Involved</a></li>
          <li><a href="events.html" class="nav-a">Events</a></li>
        </ul>
        <div class="nav-end">
          <a href="donate.html" class="btn btn-donate magnetic ripple">Donate</a>
          <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
      <div class="mobile-nav" id="mobileNav" aria-hidden="true">
        <div class="mobile-nav-scroll">
          <ul role="list">
            <li><a href="home.html" class="nav-a" data-close>Home</a></li>
            <li><a href="events.html" class="nav-a" data-close>Events</a></li>
            <li style="margin-top: 20px">
              <a href="donate.html" class="btn btn-donate ripple" data-close>Donate Now</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="auth-section">
      <div class="auth-card reveal">
        <h1>Reset Your Password</h1>
        <p class="auth-sub" id="authSub">
          Enter your email or phone and we'll send you a one-time code.
        </p>

        <div class="auth-error" id="authError"></div>
        <div class="auth-success" id="authSuccess"></div>

        <!-- Step 1: identifier -->
        <form id="step1">
          <div class="form-group">
            <label for="identifier">Email or Phone</label>
            <input type="text" id="identifier" class="form-control" required
              placeholder="you@example.com or 10-digit phone" autocomplete="username" />
          </div>
          <button type="submit" class="auth-btn" id="sendBtn">Send OTP</button>
        </form>

        <!-- Step 2: OTP -->
        <form id="step2" style="display: none">
          <div class="form-group">
            <label for="otp">Enter 6-digit OTP</label>
            <input type="text" id="otp" class="form-control" inputmode="numeric"
              maxlength="6" pattern="[0-9]{6}" placeholder="••••••" autocomplete="one-time-code" />
          </div>
          <button type="submit" class="auth-btn" id="verifyBtn">Verify OTP</button>
          <div class="auth-guest" style="margin-top: 14px">
            <a href="#" id="resendLink">Resend OTP</a>
          </div>
        </form>

        <!-- Step 3: new password -->
        <form id="step3" style="display: none">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="pw-wrap">
              <input type="password" id="newPassword" class="form-control"
                placeholder="Min 8 chars, A-z, 0-9, symbol" autocomplete="new-password" />
              <button type="button" class="pw-toggle" data-target="newPassword">Show</button>
            </div>
            <div class="pw-strength"><span id="pwBar"></span></div>
            <div class="pw-hint" id="pwHint">Use 8+ characters with upper, lower, number &amp; symbol.</div>
          </div>
          <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" class="form-control" placeholder="Re-enter password" autocomplete="new-password" />
          </div>
          <button type="submit" class="auth-btn" id="resetBtn">Reset Password</button>
        </form>

        <div class="auth-alt"><a href="login.html">← Back to login</a></div>
      </div>
    </section>

    <script type="module" src="home.js"></script>
    <script type="module" src="forgot-password.js"></script>
  </body>
</html>
